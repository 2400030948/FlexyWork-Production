# Render blueprint: https://render.com
# 1. Push this repo to GitHub
# 2. Go to https://dashboard.render.com → New → Blueprint
# 3. Connect the FlexyWork repo and apply this file
# 4. Fill in secret env vars in the Render dashboard after create

services:
  - type: web
    name: flexywork
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    dockerCommand: ""
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: http://127.0.0.1:4000
      - key: API_PORT
        value: "4000"
      - key: WEB_PORT
        value: "3000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
