# Render blueprint for the FlexyWork Express API.
# The Next.js frontend is deployed separately to Vercel and points at the
# public URL of this service via the API_URL (server-only) /
# NEXT_PUBLIC_API_URL (public) env vars configured in the Vercel project.
#
# Steps:
#   1. Push this repo to GitHub.
#   2. Go to https://dashboard.render.com -> New -> Blueprint.
#   3. Connect the FlexyWork repo and apply this file.
#   4. Fill in the secret env vars in the Render dashboard after create.

services:
  - type: web
    name: flexywork-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm run start:api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: 0.0.0.0
      # Comma-separated list of allowed origins for CORS. Add your Vercel
      # production URL (and any preview URLs you want to allow) here.
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
